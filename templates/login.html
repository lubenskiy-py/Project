{% extends 'base.html' %}

{% block content %}
    <h1>Вхід</h1>
    <form method="POST" action="{{ url_for('login') }}">
        {{ form.hidden_tag() }}
        <div>
            {{ form.email.label }} {{ form.email() }}
        </div>
        <div>
            {{ form.password.label }} {{ form.password() }}
        </div>
        <button type="submit">Вiйти</button>
    </form>
{% endblock %}
